# Regenerate the social share cards without needing Chromium locally.
#
# Cards live in static/og/ and are committed to the repo; `npm run og` only
# re-renders the ones whose source changed. Run this from the Actions tab on
# the branch you want updated, then review the image diff.
name: Regenerate social cards

on:
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # No Hugo install step: scripts/hugo.sh (behind `npm run build`) fetches
      # the version pinned in .hugo-version, the same one every other build
      # uses. Pinning it here as well is how CI and local drifted apart.
      - name: Build site
        run: npm run build

      - name: Render cards
        run: npm run og

      - name: Commit any changes
        run: |
          if git diff --quiet -- static/og data/og; then
            echo "Social cards already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/og data/og
          git commit -m "Regenerate social share cards"
          git push
