name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # No browser on `npm ci`: the contrast step below installs Chromium
      # explicitly, and the cards are only hashed here, never rendered.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      # No Hugo install step: scripts/hugo.sh (behind `npm run build`) fetches
      # the version pinned in .hugo-version, the same one every other build
      # uses. Pinning it here as well is how CI and local drifted apart.
      - name: Build site
        run: npm run build

      - name: Check social cards are current
        run: npm run og:check

      - name: Run tests
        run: npm test

      # Text contrast in both themes, measured in a real browser: the blog's
      # bullet lists once rendered light grey on the light theme, which no
      # HTML-reading test could see. Fails on anything below WCAG AA.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 0

      - name: Check text contrast (both themes)
        run: npm run contrast
