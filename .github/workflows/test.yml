name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # This job only hashes the cards (`npm run og:check`); it never renders
      # them, so there is no reason to pull down a browser on install.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      # No Hugo install step: scripts/hugo.sh (behind `npm run build`) fetches
      # the version pinned in .hugo-version, the same one every other build
      # uses. Pinning it here as well is how CI and local drifted apart.
      - name: Build site
        run: npm run build

      - name: Check social cards are current
        run: npm run og:check

      - name: Run tests
        run: npm test
