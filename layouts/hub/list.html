{{ define "main" }}
  {{ partial "hub/page-header.html" . }}

  <div class="max-w-3xl mx-auto px-6 py-14 md:py-20">
    <div class="hub-prose">
      {{ .Content }}
    </div>

    {{- with .RegularPages.ByWeight }}
    <nav class="mt-16 pt-10 border-t border-cream/20 grid gap-px bg-cream/50 sm:grid-cols-3 overflow-hidden">
      {{- range . }}
      <a href="{{ .RelPermalink }}" class="group bg-ink p-6 hover:bg-ink-light transition-colors">
        <h2 class="font-display text-xl text-cream group-hover:text-ember transition-colors">{{ .Title }}</h2>
        {{- with .Params.blurb }}
        <p class="text-base text-cream/75 mt-2 leading-relaxed">{{ . }}</p>
        {{- end }}
      </a>
      {{- end }}
    </nav>
    {{- end }}
  </div>
{{ end }}
