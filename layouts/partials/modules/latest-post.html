{{ $posts := where .Site.RegularPages "Section" "blog" }}
{{ range first 1 $posts.ByDate.Reverse }}
<section class="border-t border-cream/10">
  <div class="max-w-6xl mx-auto px-6 py-24">

    <div class="flex items-baseline justify-between mb-12">
      <h2 class="font-display text-3xl md:text-4xl text-cream font-light">Studio notes</h2>
      <a
        href="/blog/"
        data-track-event="Blog Callout Click"
        data-track-props='{"location":"home"}'
        class="text-ember text-sm hover:underline tracking-wide"
      >All notes →</a>
    </div>

    <article class="group">
      <div class="flex flex-col md:flex-row md:items-start gap-2 md:gap-16">

        <time
          datetime="{{ .Date.Format "2006-01-02" }}"
          class="shrink-0 text-cream/45 text-xs tracking-widest uppercase pt-1 md:w-32 md:text-right"
        >
          {{ .Date.Format "Jan 2006" }}
        </time>

        <div class="flex-1 min-w-0">
          <h3 class="font-display text-2xl md:text-3xl text-cream font-light leading-snug mb-4 group-hover:text-ember transition-colors duration-300">
            <a
              href="{{ .RelPermalink }}"
              data-track-event="Blog Callout Click"
              data-track-props='{"location":"home"}'
            >{{ .Title }}</a>
          </h3>
          {{ with .Description }}
          <p class="text-cream/60 text-base leading-relaxed mb-6 max-w-xl">{{ . }}</p>
          {{ end }}
          <a
            href="{{ .RelPermalink }}"
            data-track-event="Blog Callout Click"
            data-track-props='{"location":"home"}'
            class="inline-flex items-center gap-2 text-ember text-sm tracking-widest uppercase transition-all duration-200 hover:gap-3"
          >
            Read
            <span aria-hidden="true" class="transition-transform duration-200 group-hover:translate-x-1">→</span>
          </a>
        </div>

      </div>
    </article>

  </div>
</section>
{{ end }}
