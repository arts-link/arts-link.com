<footer class="border-t border-cream/20 mt-24 print:hidden">
  <div
    class="max-w-5xl mx-auto px-6 py-12 flex flex-col md:flex-row justify-between items-start md:items-center gap-6"
    x-data="{
      isDark: !document.documentElement.classList.contains('light'),
      toggleTheme() {
        document.documentElement.classList.add('theme-transitioning');
        this.isDark = !this.isDark;
        document.documentElement.classList.toggle('light', !this.isDark);
        localStorage.setItem('theme', this.isDark ? 'dark' : 'light');
        setTimeout(() => document.documentElement.classList.remove('theme-transitioning'), 400);
      }
    }"
  >
    <div class="text-base text-cream/75 leading-relaxed">
      <p class="text-cream">Ben Strawbridge · Arts-Link</p>
      <p><a href="mailto:ben@benstrawbridge.com" class="text-cream underline decoration-ember decoration-2 underline-offset-2 hover:decoration-ember-light transition-colors">ben@benstrawbridge.com</a></p>
      <p class="mt-4 text-sm text-cream/75">Private page. Not indexed, not listed.</p>
    </div>

    <button
      @click="toggleTheme()"
      :aria-label="isDark ? 'Switch to light mode' : 'Switch to dark mode'"
      class="text-sm tracking-widest uppercase text-cream/75 hover:text-cream border border-cream/50 hover:border-ember px-3 py-2 transition-colors"
    >
      <span x-text="isDark ? 'Light mode' : 'Dark mode'">Light mode</span>
    </button>
  </div>
</footer>
