{{ define "main" }}
<div class="min-h-[80vh] flex flex-col items-center justify-center text-center px-6">
  <p class="text-ember text-xs tracking-[0.3em] uppercase mb-6">{{ .Params.eyebrow | default "Message received" }}</p>
  <h1 class="font-display text-5xl md:text-7xl text-cream font-light mb-6">{{ .Params.heading | default "Thank you." }}</h1>
  <p class="text-cream/50 text-lg max-w-sm mb-14 leading-relaxed">
    {{ .Params.body | default "I'll get back to you personally within a day or two." }}
  </p>
  <a href="{{ .Params.back_href | default "/" }}" class="text-cream/40 hover:text-cream text-sm tracking-wide transition-colors">
    {{ .Params.back_text | default "← Back to home" }}
  </a>
</div>
{{ end }}
