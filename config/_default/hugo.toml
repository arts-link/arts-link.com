baseURL = 'https://www.arts-link.com/'
copyright = "© arts-link.com ⚡"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
languageCode = "en-us"
# sectionPagesMenu = "main"
summaryLength = 25
timeZone = "America/Los_Angeles"
title = 'arts-link.com dev'
enableEmoji = true
enableGitInfo = false 
  

[build]
  writeStats = true

[outputFormats.llmstxt]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

# Social share cards. Each page renders a second HTML output at og.html — a
# 1200x630 card styled with the site's own CSS. scripts/og-images.mjs
# screenshots those into static/og/. See `npm run og`.
[outputFormats.ogcard]
  mediaType = "text/html"
  baseName = "og"
  isHTML = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "llmstxt", "ogcard"]
  page = ["HTML", "ogcard"]
  section = ["HTML", "ogcard"]
  
[module]
  [module.hugoVersion]
    extended = false
    min = "0.116.0"
  [[module.mounts]]
    source = "assets"
    target = "assets"
